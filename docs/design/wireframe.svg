<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1100" role="img"><title>LeadFlow · interface wireframe</title><desc>Layout map of the implemented single-screen workspace and its dialogs; screenshots show the finished UI</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#263f35;font-size:16px}.title{font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:600}.small{font-size:14px;fill:#5e6e65}.label{font-weight:600}.muted{fill:#f4f7f3}</style><rect x="0" y="0" width="1360" height="1100" rx="0" fill="#f4f7f3" stroke="none" /><text class="title" x="35" y="52">LeadFlow · interface wireframe</text><text class="small" x="35" y="83">Layout map of the implemented single-screen workspace and its dialogs; screenshots show the finished UI</text><rect x="35" y="115" width="805" height="560" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="55" y="149">Workspace</text><line x1="35" y1="167" x2="840" y2="167" stroke="#7b9184" stroke-width="2" /><text class="label" x="55" y="203">LeadFlow   /   My workspace</text><rect x="655" y="179" width="163" height="37" rx="10" fill="#edf3e8" stroke="#c6d1c7" /><text class="" x="675" y="204">+ Add new lead</text><rect x="55" y="238" width="177" height="68" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="70" y="265">Total leads</text><text class="heading" x="70" y="290">—</text><rect x="249" y="238" width="177" height="68" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="264" y="265">Due today</text><text class="heading" x="264" y="290">—</text><rect x="443" y="238" width="177" height="68" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="458" y="265">Overdue</text><text class="heading" x="458" y="290">—</text><rect x="637" y="238" width="177" height="68" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="652" y="265">Won</text><text class="heading" x="652" y="290">—</text><text class="label" x="55" y="349">[ List | Pipeline ]</text><text class="" x="664" y="349">[ Export CSV ]</text><text class="small" x="55" y="388">All   New   Contacted   Qualified   Proposal Sent   Won   Lost</text><rect x="55" y="405" width="765" height="40" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="69" y="431">Search name, company, email or source…</text><text class="small" x="55" y="474">Follow-up filter  /  Attention views  /  Priority  /  Active or archived</text><rect x="55" y="491" width="765" height="66" rx="10" fill="#edf3e8" stroke="#c6d1c7" /><text class="label" x="69" y="516">TODAY'S FOLLOW-UPS — pinned before other leads</text><text class="small" x="69" y="542">Name + company     Status badge     Latest note + time ago     Reminder</text><rect x="55" y="570" width="765" height="55" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="small" x="69" y="600">Other leads · same columns · click a row to open its dialog</text><text class="small" x="55" y="652">Pipeline view: New → Contacted → Qualified → Proposal Sent → Won / Lost</text><rect x="875" y="115" width="450" height="910" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="895" y="149">Lead dialog · persistent heading   ×</text><line x1="875" y1="167" x2="1325" y2="167" stroke="#7b9184" stroke-width="2" /><text class="small" x="895" y="204">Name, company, phone        [ Status ]</text><text class="label" x="895" y="245">[ Activity ]       [ Lead details ]</text><rect x="895" y="268" width="410" height="56" rx="10" fill="#edf3e8" stroke="#c6d1c7" /><text class="small" x="908" y="291">Current reminder / overdue label</text><text class="small" x="908" y="313">[ Mark complete ]</text><text class="small" x="895" y="357">[ Schedule / reschedule ]  [ Calendar ]</text><rect x="895" y="379" width="410" height="98" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="small" x="910" y="407">Optional standalone reminder editor</text><text class="small" x="910" y="436">[ Date + time ]  [ Quick date ]  [ Save ]</text><text class="label" x="895" y="516">Conversation history · newest first</text><rect x="895" y="537" width="410" height="70" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="small" x="910" y="565">Latest discussion + timestamp</text><text class="small" x="910" y="589">Activity type / note / historical reminder</text><rect x="895" y="622" width="410" height="70" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="small" x="910" y="650">Earlier discussion + timestamp</text><text class="small" x="910" y="674">Activity type / note / historical reminder</text><text class="small" x="895" y="728">[ Load older discussions ]</text><rect x="895" y="754" width="410" height="186" rx="10" fill="#f7f9f5" stroke="#c6d1c7" /><text class="label" x="910" y="784">Add discussion   [ Activity type ]</text><rect x="910" y="802" width="379" height="54" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="small" x="924" y="835">Discussion text…</text><text class="small" x="910" y="885">[ ] Optional follow-up date and time</text><text class="small" x="1117" y="921">[ Save discussion ]</text><text class="small" x="895" y="975">One scrolling content area below the heading.</text><text class="small" x="895" y="999">Unsaved changes: Keep editing / Discard changes.</text><rect x="35" y="710" width="387" height="315" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="55" y="744">Add-lead dialog</text><line x1="35" y1="762" x2="422" y2="762" stroke="#7b9184" stroke-width="2" /><text class="small" x="55" y="799">Name *</text><text class="small" x="55" y="834">Company / phone (optional)</text><text class="small" x="55" y="869">Email / source (optional)</text><text class="small" x="55" y="904">Priority / value / currency</text><text class="small" x="55" y="939">Default status: New</text><text class="small" x="55" y="974">[ Cancel ]             [ Add lead ]</text><rect x="453" y="710" width="387" height="315" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="473" y="744">Lead-details tab</text><line x1="453" y1="762" x2="840" y2="762" stroke="#7b9184" stroke-width="2" /><text class="small" x="473" y="799">Editable contact fields</text><text class="small" x="473" y="834">Priority, deal value and currency</text><text class="small" x="473" y="869">[ Save lead details ]</text><text class="small" x="473" y="904">Archive or restore with history intact</text><text class="small" x="473" y="939">Conflict? Keep draft and reload details</text><text class="small" x="473" y="974">Mobile: controls stack inside the viewport</text><text class="small" x="35" y="1072">One page. No navigation away from the lead list. Dialogs support keyboard use and small screens.</text></svg>