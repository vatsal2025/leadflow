<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img"><title>LeadFlow · architecture</title><desc>Production request path, persistent storage, and separate schema migrations</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#263f35;font-size:16px}.title{font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:600}.small{font-size:14px;fill:#5e6e65}.label{font-weight:600}.muted{fill:#f4f7f3}</style><rect x="0" y="0" width="1280" height="720" rx="0" fill="#f4f7f3" stroke="none" /><text class="title" x="35" y="52">LeadFlow · architecture</text><text class="small" x="35" y="83">Production request path, persistent storage, and separate schema migrations</text><rect x="35" y="130" width="365" height="180" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="55" y="164">Browser</text><line x1="35" y1="182" x2="400" y2="182" stroke="#7b9184" stroke-width="2" /><text class="" x="55" y="214">React + TanStack Query</text><text class="" x="55" y="243">List, pipeline, dialogs</text><text class="" x="55" y="272">Public demo: no login</text><rect x="460" y="130" width="365" height="180" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="480" y="164">Next.js on Vercel</text><line x1="460" y1="182" x2="825" y2="182" stroke="#7b9184" stroke-width="2" /><text class="" x="480" y="214">App and static assets</text><text class="" x="480" y="243">Same-origin /api rewrite</text><text class="" x="480" y="272">Browser security headers</text><rect x="875" y="130" width="365" height="180" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="895" y="164">FastAPI on Vercel</text><line x1="875" y1="182" x2="1240" y2="182" stroke="#7b9184" stroke-width="2" /><text class="" x="895" y="214">Validation and query logic</text><text class="" x="895" y="243">Transactions and version checks</text><text class="" x="895" y="272">CSV / calendar generation</text><line x1="400" y1="214" x2="460" y2="214" stroke="#7b9184" stroke-width="2" /><polyline stroke-width="2" points="452,209 460,214 452,219" fill="none" stroke="#7b9184" /><line x1="825" y1="214" x2="875" y2="214" stroke="#7b9184" stroke-width="2" /><polyline stroke-width="2" points="867,209 875,214 867,219" fill="none" stroke="#7b9184" /><text class="small" x="405" y="192">HTTPS</text><text class="small" x="833" y="192">API</text><rect x="875" y="410" width="365" height="196" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="895" y="444">Supabase PostgreSQL · Mumbai</text><line x1="875" y1="462" x2="1240" y2="462" stroke="#7b9184" stroke-width="2" /><text class="" x="895" y="492">TLS transaction pooler</text><text class="" x="895" y="519">Leads + discussion history</text><text class="" x="895" y="546">One connection per API instance</text><text class="" x="895" y="573">Direct anonymous Data API: RLS</text><line x1="1060" y1="310" x2="1060" y2="410" stroke="#7b9184" stroke-width="2" /><polyline stroke-width="2" points="1055,402 1060,410 1065,402" fill="none" stroke="#7b9184" /><text class="small" x="1074" y="365">SQLAlchemy / psycopg</text><rect x="460" y="430" width="365" height="156" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="480" y="464">Alembic release command</text><line x1="460" y1="482" x2="825" y2="482" stroke="#7b9184" stroke-width="2" /><text class="" x="480" y="515">Migrations 0001 → 0003</text><text class="" x="480" y="544">Private session/direct connection</text><line x1="825" y1="516" x2="875" y2="516" stroke="#7b9184" stroke-width="2" stroke-dasharray="6 5" /><polyline stroke-width="2" points="867,511 875,516 867,521" fill="none" stroke="#7b9184" /><rect x="35" y="430" width="365" height="156" rx="10" fill="#fff" stroke="#c6d1c7" /><text class="heading" x="55" y="464">Local development</text><line x1="35" y1="482" x2="400" y2="482" stroke="#7b9184" stroke-width="2" /><text class="" x="55" y="515">Docker Compose: web + API + DB</text><text class="" x="55" y="544">Or Python + Node.js with SQLite</text><text class="small" x="35" y="655">Database credentials stay on the server. The browser calls the application API, not Supabase directly.</text><text class="small" x="35" y="683">The public demo allows shared edits. Optional authentication is available for other installations.</text></svg>